render_digest:
  name: Render weekly digest
  description: Return an age-matched weekly digest with email content and source-coverage metadata. This action does not send email or schedule delivery.
  fields:
    force_refresh:
      name: Refresh first
      description: Wait for a completed feed refresh before rendering. If all source requests fail, the action fails. Turn off to use cached data, which may be stale. Partial results include coverage metadata.
      required: false
      default: true
      selector:
        boolean:
    embed_images:
      name: Embed event images
      description: Download supported event images and return temporary image paths plus SMTP attachments when Local Media is configured. Cleanup is scheduled after one hour; send the digest before then.
      required: false
      default: false
      selector:
        boolean:
